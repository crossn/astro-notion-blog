name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  seo:
    name: SEO (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: production
            branch: main
            site: https://tsukurun-lab.com
          - mode: preview
            branch: seo-review
            site: https://seo-review.tsukurun-lab.pages.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Build with offline Notion fixture
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: ${{ matrix.branch }}
          CF_PAGES_URL: https://seo-review.tsukurun-lab.pages.dev
          ASTRO_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: --import ./tests/fixtures/notion-seo.mjs
        run: npm run build

      - name: Verify SEO output
        run: python3 tests/verify-seo-discovery.py --mode "${{ matrix.mode }}" --site "${{ matrix.site }}"
